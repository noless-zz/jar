# Installs the app on Android emulators and runs the tests in android/app/src/androidTest
# (the task screen: done sections, archive, parents-only settings; the app starts at all).
# Screenshots of every screen are attached to the run (Summary -> Artifacts), and when the run
# belongs to a pull request they are also shown in a comment on that PR (one comment, updated
# on every run; the pictures live on the ci-screenshots branch).
# Runs on Android changes, and before every release (android-release.yml calls it and only
# publishes when it passes).
name: Android emulator tests

on:
  pull_request:
    paths: ["android/**", ".github/workflows/android-emulator.yml"]
  push:
    branches: [main]
    paths:
      - "android/**"
      - "!android/VERSION"        # a release push: android-release.yml runs these tests itself
      - "!android/CHANGES.md"
      - ".github/workflows/android-emulator.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]   # Android 10 (the oldest Jar supports) and Android 14
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6

      - name: Build the app and the tests
        run: ./gradlew --no-configuration-cache assembleDebug assembleDebugAndroidTest assembleQa

      - name: Run the tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # A freshly booted emulator sometimes shows "System UI isn't responding" or is slow to
          # give the app window focus: hide error dialogs, unlock, and retry the tests once.
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb shell input keyevent 82 || true
            ./gradlew --no-configuration-cache connectedDebugAndroidTest || ./gradlew --no-configuration-cache connectedDebugAndroidTest || touch tests-failed
            mkdir -p screenshots/api-${{ matrix.api-level }}
            adb pull /sdcard/Pictures/jar/. screenshots/api-${{ matrix.api-level }}/ || true
            # The release build as R8 shrinks it (qa = release signed with the debug key): does it start and draw?
            adb logcat -b crash -c || true
            adb install -r app/build/outputs/apk/qa/app-qa.apk
            adb shell am start -W -n com.noam.jar.qa/com.noam.jar.TasksActivity
            sleep 8
            adb exec-out screencap -p > screenshots/api-${{ matrix.api-level }}/90-qa-release-start.png || true
            adb shell pidof com.noam.jar.qa || { echo "the shrunk release build is not running"; touch tests-failed; }
            if adb logcat -d -b crash | grep -q "com.noam.jar.qa"; then adb logcat -d -b crash; echo "the shrunk release build crashed"; touch tests-failed; fi
            test ! -f tests-failed

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api-${{ matrix.api-level }}
          path: android/screenshots/
          if-no-files-found: warn

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-api-${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/

  # Shows the screenshots in the PR: one comment per PR, updated on every run, pass or fail.
  # The images are shrunk and kept on the ci-screenshots branch (one squashed commit, latest run
  # per PR, the 30 newest PRs), so raw.githubusercontent.com can serve them to the comment.
  pr-screenshots:
    needs: emulator
    if: always() && needs.emulator.result != 'skipped' && needs.emulator.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RESULT: ${{ needs.emulator.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          N="${{ github.event.pull_request.number }}"
          if [ -n "$N" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "$REPO" ]; then
            echo "::notice::PR from a fork: no comment (the token can't write there)"; exit 0
          fi
          if [ -z "$N" ]; then
            # a push or a manual run: the open PR whose head is this commit (none for a release push)
            N="$(gh api "repos/$REPO/commits/${{ github.sha }}/pulls" -q '[.[] | select(.state=="open")][0].number // empty' || true)"
          fi
          echo "number=$N" >> "$GITHUB_OUTPUT"
          [ -n "$N" ] || echo "::notice::No open pull request for this run; screenshots stay in the artifacts."

      - uses: actions/download-artifact@v4
        if: steps.pr.outputs.number != ''
        with:
          pattern: screenshots-api-*
          path: shots

      - name: Store the screenshots and comment
        if: steps.pr.outputs.number != ''
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          DIR="pr-$PR/${{ github.run_id }}"
          git init -q pub && cd pub
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch -q --depth 1 origin ci-screenshots && git checkout -q FETCH_HEAD || true
          # keep one run per PR and only the 30 newest PRs
          rm -rf "pr-$PR"
          { ls -d pr-* 2>/dev/null || true; } | sed 's/pr-//' | sort -n | head -n -29 | sed 's/^/pr-/' | xargs -r rm -rf || true
          IM="$(command -v magick || command -v convert || true)"
          for d in ../shots/*/api-*; do
            [ -d "$d" ] || continue
            api="$(basename "$d")"; mkdir -p "$DIR/$api"
            for f in "$d"/*.png; do
              [ -f "$f" ] || continue
              out="$DIR/$api/$(basename "${f%.png}").jpg"
              if [ -n "$IM" ]; then "$IM" "$f" -resize 360x -quality 80 "$out"; else cp "$f" "$DIR/$api/"; fi
            done
          done
          if [ ! -d "$DIR" ]; then echo "::notice::No screenshots to show"; exit 0; fi
          git checkout -q --orphan fresh
          git add -A
          git commit -q -m "Screenshots: PR #$PR, run ${{ github.run_id }}"
          git push -q -f origin fresh:ci-screenshots
          BASE="https://raw.githubusercontent.com/$REPO/ci-screenshots/$DIR"

          case "$RESULT" in success) STATUS="✅ Emulator tests passed";; *) STATUS="❌ Emulator tests failed";; esac
          {
            echo "<!-- jar-screenshots -->"
            echo "### 📱 Emulator screenshots"
            echo "$STATUS for ${SHA:0:7} · [run]($RUN_URL)"
            for api in $(ls "$DIR" | sort -t- -k2 -nr); do
              n="$(ls "$DIR/$api" | wc -l)"
              if [ "$api" = "$(ls "$DIR" | sort -t- -k2 -nr | head -1)" ]; then echo "<details open>"; else echo "<details>"; fi
              echo "<summary><b>${api/api-/Android API }</b> ($n)</summary>"
              echo
              echo "<table><tr>"
              i=0
              for f in $(ls "$DIR/$api" | sort); do
                name="${f%.*}"
                echo "<td align=\"center\"><img src=\"$BASE/$api/$f\" width=\"180\"><br><sub>$name</sub></td>"
                i=$((i+1)); [ $((i % 4)) -eq 0 ] && echo "</tr><tr>"
              done
              echo "</tr></table>"
              echo "</details>"
            done
          } > ../comment.md
          cd ..
          ID="$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- jar-screenshots -->")) | .id' | tail -1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md -q .html_url
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md -q .html_url
          fi
