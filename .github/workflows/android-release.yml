# Publishing a family release, either way:
#   - change android/VERSION (e.g. 0.4.0) and push to main, or
#   - push a tag like v0.4.0 (VS Code: "Android: Publish release").
# This builds the signed APK and attaches it to a GitHub Release; the phones see it and offer "Update".
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions), set once with
# tools/set-github-secrets.ps1:
#   JAR_KEYSTORE_BASE64   the release keystore (base64)
#   JAR_KEYSTORE_PASSWORD
#   JAR_KEY_ALIAS
#   JAR_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["android/VERSION"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.4.0 (creates tag v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME}"
          else V="$(tr -d ' \r\n' < android/VERSION)"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$V is already released; bump android/VERSION to publish a new one."
          fi
      - name: Check signing secrets
        if: steps.v.outputs.skip != 'true'
        env:
          KS: ${{ secrets.JAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Signing secrets are missing. Run tools/set-github-secrets.ps1 on the PC (see docs/RELEASES.md)."
            exit 1
          fi
      - uses: actions/setup-java@v6
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.v.outputs.skip != 'true'
      - name: Build signed release APK
        if: steps.v.outputs.skip != 'true'
        working-directory: android
        env:
          JAR_KEYSTORE_B64: ${{ secrets.JAR_KEYSTORE_BASE64 }}
          JAR_KEYSTORE_FILE: release.jks
          JAR_KEYSTORE_PASSWORD: ${{ secrets.JAR_KEYSTORE_PASSWORD }}
          JAR_KEY_ALIAS: ${{ secrets.JAR_KEY_ALIAS }}
          JAR_KEY_PASSWORD: ${{ secrets.JAR_KEY_PASSWORD }}
        run: |
          echo "$JAR_KEYSTORE_B64" | base64 -d > release.jks
          ./gradlew --no-configuration-cache testDebugUnitTest assembleRelease -PjarVersion=${{ steps.v.outputs.version }}
          rm -f release.jks
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/jar-${{ steps.v.outputs.version }}.apk
      - name: Publish GitHub Release
        if: steps.v.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Jar ${{ steps.v.outputs.version }}
          body_path: android/CHANGES.md
          generate_release_notes: true
          files: dist/jar-${{ steps.v.outputs.version }}.apk
