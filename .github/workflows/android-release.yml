# Publishing a family release: push a tag like v0.4.0 (VS Code: "Android: Publish release").
# This builds the signed APK and attaches it to a GitHub Release; the phones see it and offer "Update".
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions), set once with
# tools/set-github-secrets.ps1:
#   JAR_KEYSTORE_BASE64   the release keystore (base64)
#   JAR_KEYSTORE_PASSWORD
#   JAR_KEY_ALIAS
#   JAR_KEY_PASSWORD
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.4.0 (creates tag v0.4.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then V="${{ github.event.inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: Check signing secrets
        env:
          KS: ${{ secrets.JAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Signing secrets are missing. Run tools/set-github-secrets.ps1 on the PC (see docs/RELEASES.md)."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        working-directory: android
        env:
          JAR_KEYSTORE_B64: ${{ secrets.JAR_KEYSTORE_BASE64 }}
          JAR_KEYSTORE_FILE: release.jks
          JAR_KEYSTORE_PASSWORD: ${{ secrets.JAR_KEYSTORE_PASSWORD }}
          JAR_KEY_ALIAS: ${{ secrets.JAR_KEY_ALIAS }}
          JAR_KEY_PASSWORD: ${{ secrets.JAR_KEY_PASSWORD }}
        run: |
          echo "$JAR_KEYSTORE_B64" | base64 -d > release.jks
          ./gradlew --no-configuration-cache testDebugUnitTest assembleRelease -PjarVersion=${{ steps.v.outputs.version }}
          rm -f release.jks
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/jar-${{ steps.v.outputs.version }}.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Jar ${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/jar-${{ steps.v.outputs.version }}.apk
