# Jar configuration. setup.ps1 copies this to config.toml (and fills in a token).
# Paths are relative to the jar folder unless absolute.

[server]
host = "0.0.0.0"
port = 8080
# The pendant and the phone app must use the same token.
token = "CHANGE-ME"
data_dir = "data"
# Open the dashboard from your phone/laptop over Tailscale: http://<PC's Tailscale IP>:8080/
# (only devices in your tailnet; the home Wi-Fi still gets "forbidden").
dashboard_tailscale = true

[transcribe]
# "large-v3-turbo" handles Hebrew + English well and fits next to the LLM in 8 GB VRAM.
# For better Hebrew, try "ivrit-ai/whisper-large-v3-turbo-ct2" (weaker on English).
model = "large-v3-turbo"
device = "auto"            # "auto" (GPU if available), "cuda" or "cpu"
compute_type = "auto"      # auto = int8_float16 on GPU, int8 on CPU
language = ""              # "" = detect per memo; or "he" / "en"
# Words Whisper should spell right (names, places, jargon). Helps a lot with Hebrew.
vocabulary = "Jar, Tailscale, Obsidian"
# Voice detection: "gentle" keeps soft word starts/ends (quiet or hesitant speech, kids); "default" = faster-whisper's
# own; "off" = transcribe everything. normalize = lift quiet recordings first. Compare on your own memos with the
# ASR bench (data/eval/asr, see docs/DEVELOPING.md). ivrit-ai models always run with language "he".
vad = "default"
normalize = false

[llm]
ollama_url = "http://localhost:11434"
model = "qwen3.5:9b"
temperature = 0.2
# How long Ollama keeps the model in VRAM after a memo. Short frees the GPU for games etc.
keep_alive = "10m"
max_rounds = 6
# Let the model reason before choosing tools: slower (some seconds per memo), much better decisions.
think = true
# Context window (tokens): instructions + tool list (~4-6k) + the memo + the model's thinking.
# Bigger costs VRAM; with tools/ollama-tuning.ps1 (flash attention + q8_0 cache) 12288 fits an 8 GB card.
# Each memo logs "context: peak X of N"; data/worker.json "gpu" says whether the model fits on the GPU.
num_ctx = 12288
# One sentence about you, so the model files things sensibly (optional):
# about = "I'm a teacher; 'school' means my school's Google account."

[notes]
# Where notes, tasks and events are written. Point this at an Obsidian vault
# (or a OneDrive folder) later; the files are plain Markdown + .ics.
dir = "notes"
timezone = "Asia/Jerusalem"

[worker]
poll_seconds = 5
max_attempts = 3

[supervisor]
# Restart server + worker when code or this file changes (or one crashes).
auto_restart = true
# When this folder is a git clone of the GitHub repo: pull new commits by itself
# (fast-forward only; local edits are never overwritten).
github_pull = true
pull_minutes = 10

# ---- Calendar + email (docs/CONNECT.md). Jar creates events for you and email DRAFTS;
# you press Send yourself. An account that isn't connected falls back to local files.
[accounts]
personal = "outlook"     # your Outlook.com account — anything not school/work
school = "google"        # your school/work Google Workspace account

[outlook]
client_id = ""           # from the Microsoft app registration (docs/CONNECT.md, part A)

[google]
client_secrets = "data/secrets/google_client.json"   # downloaded OAuth client (part B)
calendar_id = "primary"

# The family's own Jar Gmail (docs/CONNECT.md, part C): SENDS email and calendar invitations by itself,
# but only to the family members' `email` addresses below. Leave it commented out to keep everything as drafts.
# [family_account]
# provider = "google"
# client_secrets = "data/secrets/google_family_client.json"
# calendar_id = "primary"


# ---- Family (docs/FAMILY.md). Each person pairs their own phone on the Pair page (http://localhost:8080/pair).
# The admin (owner of this PC) keeps using [server] token; everyone else gets a personal token automatically.
# Children's tasks for others arrive as requests a parent approves. Only the admin's memos can reach
# the calendars and email above.
# [family]
# avi  = { name = "אבי",  role = "parent", admin = true, aliases = ["Avi", "אבא"] }
# dana = { name = "דנה",  role = "parent", aliases = ["Dana", "אמא"] }
# yoni = { name = "יוני", role = "child",  aliases = ["Yoni"] }
# maya = { name = "מאיה", role = "child",  aliases = ["Maya"] }
# Add phone = "+972501234567" to anyone above so "send Dana a WhatsApp…" opens her chat directly.
# Add age = 9 to a child so the points game rates chores for their age (optional).
# Add email = "…" to anyone who should get family events and emails from the family Jar account (optional).

# Other people for WhatsApp drafts (optional). Without a number, WhatsApp asks which chat.
# [contacts]
# "סבתא" = "+972501234567"

# ---- Points game (docs/POINTS.md): coins for tasks done, a family leaderboard.
[points]
work_day_coins = 30        # a parent's work day (a task called "work day", or the Leaderboard button), once a day
week_start = "sunday"      # the leaderboard week: Sunday to Saturday
announce = "sat 20:00"     # the phones announce the week's winner and most improved then
# Read now, enforced from phase 2: coins per person per day, and a parent's OK before big payments (0 = off).
daily_cap = 150
parent_ok_over = 0
# Jar ideas (💡): coins to whoever suggested an idea when the admin accepts it, and a bonus when it ships.
idea_coins = 20
idea_shipped_bonus = 10
idea_credits_per_week = 3   # accepted ideas that pay, per person per week
idea_credit_parents = false # the other parent's ideas earn too?
