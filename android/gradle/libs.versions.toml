[versions]
agp = "9.4.1"
junit = "4.13.2"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.12.2"
work = "2.12.0"
codeScanner = "16.1.0"
testExtJunit = "1.2.1"
testRunner = "1.6.2"
testRules = "1.6.1"
espresso = "3.6.1"
uiautomator = "2.3.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
code-scanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "codeScanner" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
test-rules = { group = "androidx.test", name = "rules", version.ref = "testRules" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
